<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Paper Stacks: a personal library for research papers and links.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Paper Stacks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a reference shelf. Shelf + list rail on the left, a wall of generated paper covers on the right, detail drawer slides in over the right edge. Lists preview as fanned stacks of covers. */
:root{
  --bg:#EDF0F4; --surface:#FBFCFD; --sunk:#E2E7EE; --ink:#151D28; --muted:#5A6676; --line:#D3DAE3;
  --accent:#2747C9; --accent-ink:#FFFFFF; --accent-soft:#DCE3FA;
  --star:#C98F00; --star-soft:rgba(255,198,0,.42);
  --done:#16795A; --done-soft:#D3EEE2;
  --danger:#B3261E; --scrim:rgba(14,20,30,.38);
  --shadow:0 1px 2px rgba(20,30,50,.06),0 10px 28px rgba(20,30,50,.10);
  --f-display:"Newsreader","Iowan Old Style",Georgia,serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E131A; --surface:#151C26; --sunk:#1C2531; --ink:#E5EAF0; --muted:#95A2B2; --line:#283445;
  --accent:#8AA0FF; --accent-ink:#0B1020; --accent-soft:#1F2A4F;
  --star:#F3BF3C; --star-soft:rgba(243,191,60,.30);
  --done:#4CC892; --done-soft:#163A2C;
  --danger:#FF8A80; --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.40);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E131A; --surface:#151C26; --sunk:#1C2531; --ink:#E5EAF0; --muted:#95A2B2; --line:#283445;
  --accent:#8AA0FF; --accent-ink:#0B1020; --accent-soft:#1F2A4F;
  --star:#F3BF3C; --star-soft:rgba(243,191,60,.30);
  --done:#4CC892; --done-soft:#163A2C;
  --danger:#FF8A80; --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.40);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-block:22px 80px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{flex:none}
.brand h1{font-family:var(--f-display);font-weight:600;font-size:32px;line-height:1;letter-spacing:-.01em;margin:0}
.brand h1 em{font-style:italic;font-weight:400;color:var(--accent)}
.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}
.stats{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring{display:flex;align-items:center;gap:10px}
.ring svg{display:block}
.ring b{font-family:var(--f-mono);font-weight:500;font-size:13px;font-variant-numeric:tabular-nums}
.ring span{display:block;font-size:12px;color:var(--muted)}

/* layout */
.app{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:22px;max-height:calc(100vh - 32px);overflow:auto;padding-bottom:8px}
.label{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 8px 10px}
.railhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.railhead .label{margin-bottom:6px}
.addmini{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--muted);display:grid;place-items:center;margin-bottom:6px;flex:none}
.addmini:hover{color:var(--accent);border-color:var(--accent)}
.shelves,.rlists{display:flex;flex-direction:column;gap:2px}
.shelf{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:8px;text-align:left;font-weight:500;color:var(--ink);white-space:nowrap;min-width:0}
.shelf .nm{overflow:hidden;text-overflow:ellipsis}
.shelf:hover{background:var(--sunk)}
.shelf[aria-current="true"]{background:var(--surface);box-shadow:var(--shadow)}
.shelf .ic{width:18px;height:18px;flex:none;display:grid;place-items:center}
.shelf .n{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.shelf .dot{width:10px;height:10px;border-radius:3px;flex:none;margin-inline:4px}
.shelf.sub{padding-left:34px;font-weight:400;font-size:14px}
.shelf.sub .dot{width:7px;height:7px;border-radius:50%}
.dragging .droptgt{outline:1.5px dashed var(--line);outline-offset:-2px}
.droptgt.over{background:var(--accent-soft)!important;outline:2px dashed var(--accent)!important;outline-offset:-2px}
.tagcloud{display:flex;flex-wrap:wrap;gap:6px;padding-left:6px}
.mode{font-size:12px;color:var(--muted);padding-left:10px;display:flex;gap:6px;align-items:center}
.mode i{width:7px;height:7px;border-radius:50%;background:var(--done);display:inline-block}
.mode.local i{background:var(--star)}
.railnote{font-size:12px;color:var(--muted);padding:2px 10px 0;margin:0}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:2px 9px;font-size:12px;color:var(--muted);line-height:1.5;text-decoration:none}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip small{font-family:var(--f-mono);font-size:10px;opacity:.75}
.chip .dot{width:7px;height:7px;border-radius:2px}

/* toolbar */
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search{flex:1 1 240px;min-width:0;position:relative}
.search input{width:100%;height:42px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 40px 0 38px;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:12px;top:12px;color:var(--muted)}
.search kbd{position:absolute;right:10px;top:10px}
kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted);background:var(--surface)}
.sel{height:42px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 10px}
.toggle{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);height:42px}
.toggle button{border:0;background:none;padding:0 11px;color:var(--muted);display:grid;place-items:center}
.toggle button[aria-pressed="true"]{background:var(--sunk);color:var(--ink)}
.btn{height:42px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{height:34px;padding:0 11px;font-size:13px}
.btn.danger{color:var(--danger)}
.btn.danger.solid{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.btn kbd{background:transparent;border-color:currentColor;color:inherit;opacity:.7}
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:48px;z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:220px;display:flex;flex-direction:column}
.menu button{border:0;background:none;text-align:left;padding:9px 10px;border-radius:7px}
.menu button:hover{background:var(--sunk)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}

.crumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin:0 0 14px 2px;min-height:24px}
.crumbs h2{font-family:var(--f-display);font-size:22px;color:var(--ink);margin:0 6px 0 0;font-weight:600}

/* list page header */
.lhead{display:flex;flex-direction:column;gap:12px;margin:0 0 22px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.lcrumb{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lcrumb button{border:0;background:none;padding:0;color:var(--accent);font-weight:500}
.lcrumb button:hover{text-decoration:underline}
.ltitle{font-family:var(--f-display);font-weight:600;font-size:clamp(28px,4vw,40px);line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance;display:flex;align-items:center;gap:12px}
.ltitle .dot{width:14px;height:14px;border-radius:4px;flex:none}
.ldesc{margin:0;color:var(--muted);max-width:65ch}
.lmeta{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin:0}
.lbar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden;max-width:360px}
.lbar i{display:block;height:100%;background:var(--done);border-radius:99px;transition:width .5s}
.lacts{display:flex;gap:8px;flex-wrap:wrap}
.lfilter{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lfilter .sp{flex:1}

/* sections inside a list */
.sections{display:flex;flex-direction:column;gap:34px}
.lsec-h{display:flex;align-items:baseline;gap:10px;margin:0 0 14px;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.lsec-h h3{font-family:var(--f-display);font-weight:600;font-size:21px;margin:0;display:flex;align-items:center;gap:8px}
.lsec-h h3 .dot{width:9px;height:9px;border-radius:50%}
.lsec-h span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.lsec-h button{margin-left:auto;border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:2px 0}
.lsec-empty{color:var(--muted);font-size:14px;margin:0;padding:14px 16px;border:1.5px dashed var(--line);border-radius:10px}
.lsec-empty button{border:0;background:none;color:var(--accent);font-weight:600;padding:0}

/* lists overview */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:30px 24px}
.lcard{border-radius:14px;min-width:0}
.lcard-btn{border:0;background:none;padding:6px;margin:-6px;text-align:left;width:calc(100% + 12px);display:flex;flex-direction:column;gap:10px;color:inherit;border-radius:14px}
.lcard-btn:hover h3{color:var(--accent)}
.fan{display:flex;padding:6px 0 4px}
.fan>*{width:30%;flex:none;margin-left:-12.5%;position:relative}
.fan>*:first-child{margin-left:0}
.fan .cov{transition:transform .25s ease}
.fan .badges{display:none}
.lcard-btn:hover .fan>*{transform:translateX(calc(var(--i) * 7px)) translateY(-3px)}
.fan .ghost{aspect-ratio:2/3;border:1.5px dashed var(--line);border-radius:6px;background:var(--sunk)}
.lcard h3{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0;line-height:1.2;display:flex;align-items:center;gap:8px}
.lcard h3 .dot{width:10px;height:10px;border-radius:3px;flex:none}
.lcard .lmeta{margin-top:-4px}
.lcard .ldesc{font-size:13.5px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.lcard .subs{display:flex;flex-wrap:wrap;gap:5px;margin-top:-2px}
.newcard{border:1.5px dashed var(--line);border-radius:14px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:200px;color:var(--muted);font-weight:600;padding:16px;text-align:center}
.newcard:hover{border-color:var(--accent);color:var(--accent)}
.newcard span{font-weight:400;font-size:13px;max-width:24ch}

/* rows */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;transition:border-color .15s,box-shadow .15s}
.row:hover{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.row.cur{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.row.isdone .title-btn{color:var(--muted)}
.row-main{flex:1;min-width:0}
.row-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:2px}
.kind{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.key{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.ex{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--star)}
.title{margin:0;font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.3;text-wrap:balance}
.title-btn{border:0;background:none;padding:0;text-align:left;color:var(--ink);font:inherit}
.title-btn:hover{color:var(--accent)}
.starred .hl{background-image:linear-gradient(100deg,transparent 0 .5%,var(--star-soft) 1.5% 98.5%,transparent 99.5%);background-repeat:no-repeat;background-size:100% 46%;background-position:0 86%;-webkit-box-decoration-break:clone;box-decoration-break:clone}
mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 1px}
.meta{margin:3px 0 0;color:var(--muted);font-size:13.5px;overflow-wrap:anywhere}
.meta i{font-style:italic}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tags:empty{display:none}
.row-acts{display:flex;align-items:center;gap:8px;flex:none}
.star{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:transparent;display:grid;place-items:center;color:var(--muted)}
.star:hover{color:var(--star);border-color:var(--star)}
.star[aria-pressed="true"]{color:var(--star);background:var(--star-soft);border-color:transparent}
.star[aria-pressed="true"] path{fill:currentColor}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;height:38px}
.seg button{border:0;background:transparent;padding:0 11px;font-size:13px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button:hover{color:var(--ink);background:var(--sunk)}
.seg .w[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.seg .d[aria-pressed="true"]{background:var(--done-soft);color:var(--done)}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);background:transparent;text-decoration:none;flex:none}
.iconbtn:hover{color:var(--accent);border-color:var(--accent)}
.iconbtn[aria-disabled="true"]{opacity:.35;pointer-events:none}
.pop{animation:pop .38s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
.check path{stroke-dasharray:20;stroke-dashoffset:0}
.drawcheck path{animation:draw .35s ease-out}
@keyframes draw{from{stroke-dashoffset:20}}

/* cover wall: each paper is a generated paperback-style cover, colour keyed to its first tag */
.list.covers{display:grid;grid-template-columns:repeat(auto-fill,minmax(156px,1fr));gap:26px 18px}
.cov-item{display:flex;flex-direction:column;gap:6px;min-width:0}
.cov{position:relative;display:flex;flex-direction:column;aspect-ratio:2/3;width:100%;max-width:100%;border:0;padding:0;border-radius:6px;overflow:hidden;background:var(--cbg);color:var(--cfg);text-align:left;container-type:inline-size;box-shadow:0 1px 2px rgba(10,15,25,.16),0 6px 16px rgba(10,15,25,.14);transition:transform .2s ease,box-shadow .2s ease}
.cov::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.10),inset 6px 0 0 rgba(0,0,0,.13),inset 7px 0 0 rgba(255,255,255,.10)}
button.cov:hover,button.cov:focus-visible{transform:translateY(-5px) rotate(-.4deg);box-shadow:0 2px 4px rgba(10,15,25,.18),0 16px 32px rgba(10,15,25,.26)}
.cov:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.cov-item.cur .cov{outline:3px solid var(--accent);outline-offset:3px}
.cov-top{padding:9cqw 30cqw 0 12cqw;font-family:var(--f-mono);font-size:max(8.5px,6cqw);letter-spacing:.08em;text-transform:uppercase;opacity:.82;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cov-art{flex:1 1 auto;min-height:0;padding:6cqw 9cqw 6cqw 12cqw;display:flex}
.cov-art svg{width:100%;height:100%;display:block}
.cov-rule{height:2px;width:22cqw;background:var(--cac);margin:0 0 4.5cqw 12cqw;flex:none}
.cov-title{padding:0 9cqw 0 12cqw;font-family:var(--f-display);font-weight:600;line-height:1.1;font-size:var(--ts);letter-spacing:-.005em;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5;overflow:hidden;flex:none}
.cov-auth{padding:4cqw 9cqw 10cqw 12cqw;font-size:max(9px,6.2cqw);opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.fan .cov-top,.fan .cov-auth{font-size:6cqw}
.badges{position:absolute;top:6cqw;right:6cqw;display:flex;gap:4px}
.badge{width:max(22px,14cqw);height:max(22px,14cqw);border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 2px rgba(255,255,255,.9),0 2px 4px rgba(0,0,0,.3)}
.badge svg{width:58%;height:58%}
.badge.s{background:#F3BF3C;color:#3A2A00}
.badge.w{background:#3E5BD8;color:#FFFFFF}
.badge.d{background:#1E9B6C;color:#FFFFFF}
.cov-acts{display:flex;align-items:center;gap:1px}
.mini{width:31px;height:30px;border:0;background:none;border-radius:7px;display:grid;place-items:center;color:var(--muted);text-decoration:none;flex:none}
.mini:hover{background:var(--sunk);color:var(--ink)}
.mini.s[aria-pressed="true"]{color:var(--star)}
.mini.s[aria-pressed="true"] path{fill:currentColor}
.mini.w[aria-pressed="true"]{color:var(--accent)}
.mini.w[aria-pressed="true"] path{fill:currentColor}
.mini.d[aria-pressed="true"]{color:var(--done)}
.mini.l.has{color:var(--accent)}
.mini[aria-disabled="true"]{opacity:.35;pointer-events:none}
.cov-acts .grow{flex:1}
.cov-acts .ex{font-size:9.5px}
.skel{height:92px;border-radius:12px;background:linear-gradient(90deg,var(--sunk),var(--surface),var(--sunk));background-size:200% 100%;animation:sh 1.3s linear infinite}
.skel.poster{height:auto;aspect-ratio:2/3;border-radius:6px}
@keyframes sh{to{background-position:-200% 0}}
[draggable="true"]{-webkit-user-drag:element}

.empty{border:1.5px dashed var(--line);border-radius:14px;padding:36px 22px;text-align:center;color:var(--muted);grid-column:1/-1}
.empty h3{font-family:var(--f-display);color:var(--ink);font-size:21px;margin:0 0 6px;font-weight:600}
.empty p{margin:0 auto 16px;max-width:46ch}
.hint{margin-top:22px;color:var(--muted);font-size:12.5px;display:flex;gap:14px;flex-wrap:wrap}

/* drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);z-index:41;border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(102%);transition:transform .25s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.on{transform:none}
.dhead{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dhead .key{flex:1}
.dbody{padding:20px 22px 28px;overflow:auto;display:flex;flex-direction:column;gap:20px}
.dcover{display:grid;grid-template-columns:104px minmax(0,1fr);gap:18px;align-items:start}
.dcover .cov{box-shadow:0 4px 14px rgba(10,15,25,.22)}
.dtitle{font-family:var(--f-display);font-size:25px;line-height:1.2;font-weight:600;margin:0;text-wrap:balance}
.dauth{margin:6px 0 0;color:var(--ink);font-size:14px}
.dmeta{margin:2px 0 0;color:var(--muted);font-size:14px}
.dacts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sect h4{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.sect h4 span{text-transform:none;letter-spacing:0;font-weight:500;font-size:12px}
.pickchips{display:flex;flex-wrap:wrap;gap:6px}
.inline-new{display:flex;gap:6px;margin-top:8px}
.inline-new input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;outline:none}
.inline-new input:focus{border-color:var(--accent)}
textarea.notes{width:100%;min-height:150px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:12px 14px;line-height:1.6;outline:none}
textarea.notes:focus{border-color:var(--accent)}
.bib{font-family:var(--f-mono);font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;white-space:pre;overflow-x:auto;margin:0;line-height:1.55}
.dfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);padding-top:14px}
.dfoot div{display:flex;gap:8px}

/* popover */
.popover{position:fixed;z-index:45;width:270px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:8px}
.popover .ph{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:4px 6px 6px}
.picklist{display:flex;flex-direction:column;max-height:260px;overflow:auto}
.pick{display:flex;align-items:center;gap:9px;border:0;background:none;text-align:left;padding:7px 8px;border-radius:7px;width:100%}
.pick:hover{background:var(--sunk)}
.pick.sub{padding-left:28px;font-size:14px}
.pick .box{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.pick[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pick .dot{width:8px;height:8px;border-radius:2px;flex:none}
.pick .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.popover .none{color:var(--muted);font-size:13px;margin:4px 8px 8px}

/* modal */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:var(--scrim)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);width:min(600px,100%);max-height:calc(100% - 16px);overflow:auto;padding:22px}
.sheet.narrow{width:min(440px,100%)}
.sheet h3{font-family:var(--f-display);font-size:24px;margin:0 0 4px;font-weight:600}
.sheet .sub{color:var(--muted);margin:0 0 18px;font-size:13.5px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.full{grid-column:1/-1}
.f label,.f .lbl{font-size:12.5px;font-weight:600;color:var(--muted)}
.f input,.f textarea,.f select{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 11px;outline:none;width:100%}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.f .note{font-size:12px;color:var(--muted)}
.detect{font-family:var(--f-mono);font-size:11.5px;color:var(--done);min-height:16px}
.radios{display:flex;flex-wrap:wrap;gap:6px}
.radios button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;color:var(--muted)}
.radios button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.tagbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:6px 8px}
.tagbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tagbox input{border:0!important;box-shadow:none!important;background:transparent!important;flex:1;min-width:120px;padding:3px!important}
.tagbox .chip{background:var(--surface)}
.sugg{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.formacts{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;flex-wrap:wrap}
.err{color:var(--danger);font-size:13px;margin-top:10px}
.pickpapers{display:flex;flex-direction:column;gap:4px;max-height:50vh;overflow:auto;margin-top:12px}
.pp{display:flex;align-items:center;gap:12px;padding:6px;border-radius:9px;border:0;background:none;text-align:left;width:100%}
.pp:hover{background:var(--sunk)}
.pp .cov{width:38px;flex:none;border-radius:3px;box-shadow:0 1px 3px rgba(10,15,25,.25)}
.pp .cov>*:not(.cov-art){display:none}
.pp .cov .cov-art{padding:10%}
.pp .t{flex:1;min-width:0}
.pp .t b{display:block;font-family:var(--f-display);font-weight:600;font-size:15.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp .t span{font-size:12.5px;color:var(--muted)}
.pp .st{font-size:12.5px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px;flex:none}
.pp[aria-pressed="true"] .st{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* toast & drop */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 12px 10px 16px;border-radius:12px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow);transition:transform .25s ease;max-width:calc(100% - 32px);font-size:14px}
.toast.on{transform:translate(-50%,0)}
.toast button{border:0;background:transparent;color:var(--bg);font-weight:700;text-decoration:underline;padding:4px}
.drop{position:fixed;inset:12px;z-index:70;border:3px dashed var(--accent);border-radius:20px;background:color-mix(in srgb,var(--bg) 85%,transparent);display:grid;place-items:center;font-family:var(--f-display);font-size:28px;color:var(--accent);pointer-events:none}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);gap:16px}
  .rail{position:static;gap:10px;max-height:none;overflow:visible}
  .rail .label,.railnote,.tagsect .label{display:none}
  .railhead{justify-content:flex-start}
  .railhead .addmini{display:none}
  .shelves,.rlists{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .shelf{width:auto;border:1px solid var(--line);border-radius:999px;padding:6px 12px;flex:none}
  .shelf.sub{display:none}
  .tagcloud{flex-wrap:nowrap;overflow-x:auto;padding:0 0 4px}
  .tagcloud .chip{flex:none}
  .row{flex-direction:column;align-items:stretch;gap:12px}
  .row-acts{flex-wrap:wrap}
  .seg{flex:1}
  .seg button{flex:1;justify-content:center}
  .hint{display:none}
}
@media (max-width:520px){
  .fgrid{grid-template-columns:1fr}
  .brand h1{font-size:27px}
  .tools .sel{flex:1}
  .btn .lbl-long{display:none}
  .list.covers{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 14px}
  .dcover{grid-template-columns:84px minmax(0,1fr)}
  .lgrid{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="38" height="38" viewBox="0 0 38 38" aria-hidden="true">
        <rect x="6" y="9" width="22" height="26" rx="2" fill="var(--sunk)" stroke="var(--line)"/>
        <rect x="9" y="6" width="22" height="26" rx="2" fill="var(--surface)" stroke="var(--line)"/>
        <rect x="12" y="3" width="22" height="26" rx="2" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>
        <path d="M16 10h14M16 14h14M16 18h9" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M16 22h11" stroke="var(--star-soft)" stroke-width="5" stroke-linecap="round"/>
      </svg>
      <div>
        <h1>Paper <em>Stacks</em></h1>
        <p>Your research papers and links, sorted by what you mean to do with them.</p>
      </div>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="app">
    <nav class="rail" aria-label="Shelves and lists">
      <div>
        <p class="label">Shelves</p>
        <div class="shelves" id="shelves"></div>
      </div>
      <div>
        <div class="railhead"><p class="label">Lists</p><button class="addmini" data-newlist="" title="New list" aria-label="New list"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 5v14M5 12h14"/></svg></button></div>
        <div class="rlists" id="rlists"></div>
        <p class="railnote" id="railnote"></p>
      </div>
      <div class="tagsect">
        <p class="label">Tags</p>
        <div class="tagcloud" id="tagcloud"></div>
      </div>
      <div class="mode" id="mode"></div>
    </nav>

    <main>
      <div class="tools">
        <div class="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="Search titles, authors, tags, notes" aria-label="Search" autocomplete="off">
          <kbd>/</kbd>
        </div>
        <select id="sort" class="sel" aria-label="Sort">
          <option value="added">Recently added</option>
          <option value="title">Title A–Z</option>
          <option value="yearDesc">Year, newest</option>
          <option value="yearAsc">Year, oldest</option>
          <option value="author">First author</option>
        </select>
        <div class="toggle" role="group" aria-label="View">
          <button id="v-grid" title="Cover wall" aria-label="Cover wall"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="9.5" y="4" width="5" height="16" rx="1"/><rect x="16" y="4" width="5" height="16" rx="1"/></svg></button>
          <button id="v-list" title="List view" aria-label="List view"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        </div>
        <div class="menuwrap">
          <button class="btn" id="more" aria-haspopup="true" aria-expanded="false" aria-label="More actions"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
          <div class="menu" id="menu" hidden></div>
        </div>
        <button class="btn primary" id="add"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg><span class="lbl-long">Add paper</span><kbd>N</kbd></button>
      </div>
      <div id="head"></div>
      <div class="list" id="list" aria-live="polite"></div>
      <div class="hint"><span><kbd>J</kbd> <kbd>K</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>S</kbd> star</span><span><kbd>W</kbd> want to read</span><span><kbd>D</kbd> completed</span><span><kbd>L</kbd> add to list</span><span>Drag a cover onto a list to file it</span></div>
    </main>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Paper details" aria-hidden="true"></aside>
<div class="popover" id="popover" hidden></div>
<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" role="status"><span id="toast-msg"></span><button id="toast-act" hidden></button></div>
<div class="drop" id="drop" hidden>Drop the link to add it</div>
<input type="file" id="importfile" accept=".json,application/json" hidden>

<script>

const Store = {
  cols: {}, downloads: null, queue: new Map(), KEYS: { papers: 'paperstacks.library', lists: 'paperstacks.lists' },

  update(id, patch, c = 'papers') {

function bibtex(p) {

function ago(ts) {

  renderTagbox(); renderFormLists();

function addTag(raw) { const t = String(raw || '').trim().toLowerCase().replace(/^#/, '').replace(/\s+/g, '-').slice(0, 40); if (t && !form.tags.includes(t)) form.tags.push(t); }
function submitForm(e) {

/* ---------- export / import ---------- */
function exportJSON() {
  offerFile('paper-stacks.json', JSON.stringify({ app: 'Paper Stacks', version: 2, exported: new Date().toISOString(), lists: state.lists, papers: state.papers.map(p => { const { example, ...r } = p; return r; }) }, null, 2));
}
function exportBib() { offerFile('paper-stacks-bibtex.txt', state.papers.filter(p => p.kind === 'paper' || p.arxiv).map(bibtex).join('\n\n')); }
function exportCSV() {
  const cols = ['title','authors','year','venue','kind','url','pdf','arxiv','doi','tags','lists','starred','status','notes'];
  const val = (p, c) => c === 'lists' ? (p.lists || []).map(listById).filter(Boolean).map(listPath) : p[c];
  const cell = v => { const s = Array.isArray(v) ? v.join('; ') : (v ?? ''); return /[",\n]/.test(String(s)) ? '"' + String(s).replace(/"/g, '""') + '"' : String(s); };
  offerFile('paper-stacks.csv', [cols.join(',')].concat(state.papers.map(p => cols.map(c => cell(val(p, c))).join(','))).join('\n'));
}
async function offerFile(name, text) {
  if (Store.downloads) {
    try { await Store.downloads.save({ filename: name, data: text }); toast('Saved ' + name); return; }
    catch (e) { if (e && e.code === 'declined') return; }
  }
  if (!window.claude) {
    try { const url = URL.createObjectURL(new Blob([text], { type: 'text/plain' })); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000); toast('Downloaded ' + name); return; } catch (e) {}
  }
  showModal(`<div class="sheet"><h3>Copy your export</h3><p class="sub">Saving files isn’t available here, so copy the text and save it as <b>${esc(name)}</b>.</p><textarea class="notes" id="exp-text" readonly style="min-height:240px;font-family:var(--f-mono);font-size:12px">${esc(text)}</textarea><div class="formacts"><button class="btn" data-close="1">Close</button><button class="btn primary" id="exp-copy">Copy</button></div></div>`, 'export');
  $('#exp-copy').onclick = () => copyText(text, $('#exp-text'));
}
function copyText(text, fallbackEl) {
  const sel = () => { if (fallbackEl) { if (fallbackEl.select) fallbackEl.select(); else { const r = document.createRange(); r.selectNodeContents(fallbackEl); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } } toast('Selected. Press Ctrl+C or ⌘C to copy.'); };
  try { navigator.clipboard.writeText(text).then(() => toast('Copied'), sel); } catch (e) { sel(); }
}
async function importFile(file) {
  let parsed; try { parsed = JSON.parse(await file.text()); } catch (e) { toast('That file isn’t valid JSON. Choose a Paper Stacks export.'); return; }
  const arr = Array.isArray(parsed) ? parsed : (parsed && Array.isArray(parsed.papers) ? parsed.papers : null);
  if (!arr) { toast('No papers found in that file.'); return; }
  const idMap = {};
  const inLists = parsed && Array.isArray(parsed.lists) ? parsed.lists : [];
  inLists.filter(l => l && l.name && !l.parent).concat(inLists.filter(l => l && l.name && l.parent)).forEach(l => { idMap[l.id] = createList(l.name, l.parent ? idMap[l.parent] || null : null, l.description || ''); });
  const urls = new Set(state.papers.map(p => p.url).filter(Boolean)); let n = 0;
  for (const raw of arr) {
    if (!raw || typeof raw !== 'object' || !raw.title) continue;
    if (raw.url && urls.has(raw.url)) continue;
    const data = { title: String(raw.title), authors: Array.isArray(raw.authors) ? raw.authors.map(String) : [], year: raw.year || null, venue: raw.venue || '', kind: KIND_LABEL[raw.kind] ? raw.kind : 'paper', url: safeUrl(raw.url), pdf: safeUrl(raw.pdf), arxiv: raw.arxiv || '', doi: raw.doi || '', tags: Array.isArray(raw.tags) ? raw.tags.map(String) : [], lists: Array.isArray(raw.lists) ? raw.lists.map(x => idMap[x]).filter(Boolean) : [], notes: String(raw.notes || ''), starred: !!raw.starred, status: ['want','done'].includes(raw.status) ? raw.status : '', addedAt: raw.addedAt || Date.now(), readAt: raw.readAt || null };
    if (data.url) urls.add(data.url);
    Store.set(newId('p'), data); n++;
  }
  toast(n ? `Imported ${n} ${n === 1 ? 'item' : 'items'}` : 'Nothing new to import. Every link is already here.');
}

    if (document.activeElement === $('#q') && state.q) return clearFilter('q');

  }
  const tag = (e.target.tagName || '').toLowerCase();
  if (['input', 'textarea', 'select'].includes(tag) || e.target.isContentEditable || e.metaKey || e.ctrlKey || e.altKey) return;
  if (!$('#modal').hidden || state.pop) return;
  const ids = state.ids || []; const curId = ids[state.cursor]; const k = e.key.toLowerCase();
  if (k === '/') { e.preventDefault(); $('#q').focus(); return; }
  if (k === 'n') { e.preventDefault(); openForm(); return; }
  if (state.openId) { if (k === 's') toggleStar(state.openId); else if (k === 'w') setStatus(state.openId, 'want'); else if (k === 'd') setStatus(state.openId, 'done'); return; }
  if (k === 'j' || e.key === 'ArrowDown' || e.key === 'ArrowRight') { if (!ids.length) return; e.preventDefault(); state.cursor = Math.min(ids.length - 1, state.cursor + 1); moveCursor(); }
  else if (k === 'k' || e.key === 'ArrowUp' || e.key === 'ArrowLeft') { if (!ids.length) return; e.preventDefault(); state.cursor = Math.max(0, state.cursor - 1); moveCursor(); }
  else if (!curId) return;
  else if (k === 'enter' || k === 'o') { if (tag === 'button' || tag === 'a') return; openDrawer(curId); }
  else if (k === 's') toggleStar(curId);
  else if (k === 'w') setStatus(curId, 'want');
  else if (k === 'd') setStatus(curId, 'done');
  else if (k === 'e') openForm(curId);
  else if (k === 'l') { e.preventDefault(); const n = $$('#list [data-id]')[state.cursor]; const b = n && n.querySelector('[data-act="lists"]'); if (b) openPopover(curId, b); }
});

/* drag covers onto lists */
document.addEventListener('dragstart', e => {
  const item = e.target.closest && e.target.closest('#list [data-id]'); if (!item) return;
  state.dragging = item.dataset.id;
  e.dataTransfer.effectAllowed = 'copy';
  try { e.dataTransfer.setData('application/x-paper', state.dragging); } catch (err) {}
  document.body.classList.add('dragging'); closePopover();
});
document.addEventListener('dragend', () => { state.dragging = null; document.body.classList.remove('dragging'); $$('.over').forEach(n => n.classList.remove('over')); });
document.addEventListener('dragover', e => {
  if (state.dragging) { const t = e.target.closest && e.target.closest('[data-drop]'); if (t) { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; $$('.over').forEach(n => n !== t && n.classList.remove('over')); t.classList.add('over'); } return; }
  if (isLinkDrag(e)) e.preventDefault();
});

/* paste & drop links to add */
document.addEventListener('paste', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (['input', 'textarea'].includes(tag) || !$('#modal').hidden) return;
  const text = (e.clipboardData && e.clipboardData.getData('text') || '').trim();
  if (parseLink(text)) { e.preventDefault(); openForm(null, text); }
});
let dragDepth = 0;
const isLinkDrag = e => { const t = [...(e.dataTransfer && e.dataTransfer.types || [])]; return !t.includes('application/x-paper') && (t.includes('text/uri-list') || t.includes('text/plain') || t.includes('Files')); };
document.addEventListener('dragenter', e => { if (state.dragging || !isLinkDrag(e)) return; dragDepth++; $('#drop').hidden = false; });
document.addEventListener('dragleave', () => { if (state.dragging) return; dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $('#drop').hidden = true; });
document.addEventListener('drop', e => {
  e.preventDefault();
  if (state.dragging) {
    const t = e.target.closest && e.target.closest('[data-drop]'); const pid = state.dragging;
    state.dragging = null; document.body.classList.remove('dragging'); $$('.over').forEach(n => n.classList.remove('over'));
    if (t) { const l = listById(t.dataset.drop); const added = toggleMember(pid, t.dataset.drop, true); if (l) toast(added === false ? `Already in ${l.name}` : `Added to ${l.name}`); }
    return;
  }
  dragDepth = 0; $('#drop').hidden = true;
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (f && /json/i.test(f.type || f.name)) return importFile(f);
  if (f) { toast('Drop a link rather than a file. To keep a PDF, add the link where it lives online.'); return; }
  const text = (e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain') || '').split('\n').find(l => l.trim() && !l.startsWith('#')) || '';
  if (parseLink(text)) openForm(null, text.trim()); else if (text) toast('That doesn’t look like a link.');
});

/* go */
renderAll();
Store.init();
})();
</script>
</body>
</html>
